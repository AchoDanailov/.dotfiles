# Set prefix to Ctrl-a (instead of default Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Better pane navigation (vim style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Enable mouse support
set -g mouse on

# Set 256-color mode
set -g default-terminal "screen-256color"

# Status bar customization
set -g status-bg colour235
set -g status-fg colour136
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M"

# Better history / scrollback
set -g history-limit 10000

# NOTE: Appending '-c "#{pane_current_path}"' makes the new pane/windows open in the same directory as the running bash shell process.
# Might fail when using SSH.

# Split windows
bind | split-window -h 
bind - split-window -v 
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

# New window
bind c new-window -c "#{pane_current_path}" 

# Enable vi mode for copy mode
set -g mode-keys vi

# Panes and windows start from 1 (not from 0)
set -g base-index 1
set -g pane-base-index 1
